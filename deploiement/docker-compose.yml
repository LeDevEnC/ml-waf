services:
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - waf

  waf:
    build:
      context: ..
      dockerfile: deploiement/waf/Dockerfile
    environment:
      WAF_BACKEND: http://dvwa:80
      WAF_MODEL_PATH: /app/models/waf.joblib
      WAF_SEUIL: "0.5"
      WAF_SITE_HOST: localhost:8080
      WAF_LOG_PATH: /app/logs/waf.log
    volumes:
      - ../models:/app/models:ro
      - ./logs:/app/logs
    depends_on:
      - dvwa

  dvwa:
    image: vulnerables/web-dvwa
    ports:
      - "8081:80"
    volumes:
      - dvwa_db:/var/lib/mysql

volumes:
  dvwa_db:

x-waf: &waf
  build:
    context: ..
    dockerfile: deploiement/waf/Dockerfile
  image: deploiement-waf
  volumes:
    - ../models:/app/models:ro
    - ./logs:/app/logs

x-waf-env: &waf-env
  WAF_MODEL_PATH: /app/models/waf_tfidf.joblib
  WAF_SEUIL: "0.5919372697507891"

services:
  # nginx : un port par site protégé, chacun derrière sa propre instance du WAF
  #   8080 -> DVWA | 8082 -> WordPress | 8083 -> Juice Shop (site générique)
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:8080"
      - "8082:8082"
      - "8083:8083"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - waf-dvwa
      - waf-wordpress
      - waf-juice

  waf-dvwa:
    <<: *waf
    environment:
      <<: *waf-env
      WAF_BACKEND: http://dvwa:80
      WAF_SITE_HOST: localhost:8080
      WAF_LOG_PATH: /app/logs/waf.log
    depends_on:
      - dvwa

  waf-wordpress:
    <<: *waf
    environment:
      <<: *waf-env
      WAF_BACKEND: http://wordpress:80
      WAF_SITE_HOST: localhost:8082
      WAF_LOG_PATH: /app/logs/waf-wordpress.log
    depends_on:
      - wordpress

  waf-juice:
    <<: *waf
    environment:
      <<: *waf-env
      WAF_BACKEND: http://juice:3000
      WAF_SITE_HOST: localhost:8083
      WAF_LOG_PATH: /app/logs/waf-juice.log
    depends_on:
      - juice

  # --- Sites protégés ---
  dvwa:
    image: vulnerables/web-dvwa
    ports:
      - "8081:80"   # accès direct (sans WAF) pour comparer
    volumes:
      - dvwa_db:/var/lib/mysql

  wordpress:
    image: wordpress:6-apache
    environment:
      WORDPRESS_DB_HOST: wp-db
      WORDPRESS_DB_USER: wp
      WORDPRESS_DB_PASSWORD: wp
      WORDPRESS_DB_NAME: wordpress
      # l'URL du site est celle vue par le navigateur (donc celle du WAF)
      WORDPRESS_CONFIG_EXTRA: |
        define('WP_HOME', 'http://localhost:8082');
        define('WP_SITEURL', 'http://localhost:8082');
    volumes:
      - wp_data:/var/www/html
    depends_on:
      - wp-db

  wp-db:
    image: mariadb:11
    environment:
      MARIADB_DATABASE: wordpress
      MARIADB_USER: wp
      MARIADB_PASSWORD: wp
      MARIADB_RANDOM_ROOT_PASSWORD: "1"
    volumes:
      - wp_db:/var/lib/mysql

  juice:
    image: bkimminich/juice-shop:latest
    ports:
      - "8084:3000"   # accès direct (sans WAF) pour comparer

volumes:
  dvwa_db:
  wp_data:
  wp_db:

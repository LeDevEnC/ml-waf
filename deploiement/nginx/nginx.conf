# Résolution DNS Docker à chaque requête : nginx suit les conteneurs recréés (sinon il garde d'anciennes IP).
resolver 127.0.0.11 valid=5s ipv6=off;

# Un serveur par site protégé ; chacun envoie tout son trafic vers son instance du WAF.
# (Connection "" : l'en-tête est retiré, comme lors de l'entraînement du modèle.)

server {
  listen 8080;   # DVWA
  client_max_body_size 20m;
  location / {
    set $amont http://waf-dvwa:8000;
    proxy_pass $amont;
    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host              $http_host;
    proxy_set_header X-Real-IP         $remote_addr;
    proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }
}

